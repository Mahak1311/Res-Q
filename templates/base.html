<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Res Q{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="bg-layer bg-layer-one"></div>
    <div class="bg-layer bg-layer-two"></div>

    <header class="site-header">
      <a href="{{ url_for('dashboard') }}" class="brand">
        <span class="brand-dot"></span>
        Res Q
      </a>
      <nav class="main-nav">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logs') }}">Logs</a>
        <a href="{{ url_for('about') }}">About</a>
      </nav>
      <div class="header-status-group">
        <div class="system-badge">
          <span class="live-dot"></span>
          System Active
        </div>
        <div class="live-clock" id="liveClock">--:--:--</div>
      </div>
    </header>

    <main class="page-shell">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <p>Emergency Call Failure and Misrouting Detection System Prototype</p>
    </footer>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
