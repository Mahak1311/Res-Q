{% extends 'base.html' %}

{% block title %}Res Q | Event Logs{% endblock %}

{% block content %}
<section class="card reveal">
  <div class="logs-head">
    <div>
      <p class="eyebrow">Event Logging System</p>
      <h1>Emergency Call History</h1>
    </div>
    <div class="filter-row" id="logFilters">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="success">Success</button>
      <button class="filter-btn" data-status="failed">Failed</button>
      <button class="filter-btn" data-status="rerouted">Rerouted</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="data-table" id="logTable">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Request</th>
          <th>Mode</th>
          <th>Status</th>
          <th>Rerouted</th>
          <th>Signal</th>
          <th>Location</th>
          <th>Summary</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/logs.js') }}"></script>
{% endblock %}
